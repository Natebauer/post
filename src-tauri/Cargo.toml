[package]
name = "post"
version = "0.1.0"
description = "A calm, local Gmail client"
edition = "2021"

[lib]
name = "post_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
urlencoding = "2"
html2text = "0.12"
encoding_rs = "0.8"
png = "0.17"
mail-builder = "0.3"
chrono = "0.4"
arboard = { version = "3", default-features = false }
regex = "1"
anyhow = "1"
futures = "0.3"
once_cell = "1"
log = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
